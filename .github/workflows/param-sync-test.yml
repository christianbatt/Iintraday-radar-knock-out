name: param-sync-test
on:
  push:
    branches: [main, fix/param-sync, 'copilot/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsx src/utils/__tests__/param_merge.test.ts
      - name: Shadow research tests
        run: npm run test:shadow
      - name: Shadow V2 tests
        run: npm run test:shadowv2
      - name: ORB regression tests
        run: npm run test:orb
      - name: Shadow panel tests
        run: npm run test:shadow-panel
      - name: Features V2 tests
        run: npm run test:features-v2
      - name: Shadow V1-live tests
        run: npm run test:shadowv1live
      - name: Session close tests
        run: npm run test:sessionclose
      - name: Shadow V1-live store tests
        run: npm run test:shadowv1livestore
      - name: Shadow V1-live collector tests
        run: npm run test:shadowv1livecollector
      - name: Shadow V1-live bridge tests
        run: npm run test:shadowv1livebridge
      - name: Shadow V1-live view tests
        run: npm run test:shadowv1liveview
      - name: Shadow V1-live panel tests
        run: npm run test:shadowv1livepanel
      - name: Shadow V1-live scanner tests
        run: npx tsx src/utils/__tests__/shadow_v1_live_scanner.test.ts
      - name: Shadow market scheduler tests
        run: npx tsx src/utils/__tests__/shadow_market_scheduler.test.ts
