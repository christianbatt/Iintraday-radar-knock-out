name: param-sync-test
on:
  push:
    branches: [main, fix/param-sync, 'copilot/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx src/utils/__tests__/param_merge.test.ts
      - name: Shadow research tests
        run: npm run test:shadow
      - name: Shadow V2 tests
        run: npm run test:shadowv2
      - name: ORB regression tests
        run: npm run test:orb
      - name: Shadow panel tests
        run: npm run test:shadow-panel
      - name: Features V2 tests
        run: npm run test:features-v2
